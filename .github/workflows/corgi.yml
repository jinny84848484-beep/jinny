name: Daily Corgi Approved Upload
on:
  schedule:
    - cron: '0 10 * * *' # 19:00 KST; GitHub may start late
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [validate, publish, schedule, reconcile]
        default: validate
        description: Validate by default; publish requires approved artifact and 19 KST window
      publish_date_kst:
        type: string
        required: false
        description: 'schedule only: exact future YYYY-MM-DD (19:00 KST)'
      item_id:
        type: string
        required: false
        description: 'reconcile only: known ledger item with video receipt'
permissions:
  contents: write
concurrency:
  group: shorts-production
  cancel-in-progress: false
jobs:
  corgi:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Offline guards
        run: python tests/run_offline.py
        env:
          SHORTS_STATE_DIR: ${{ runner.temp }}/corgi-test-state
      - name: Publish approved artifact only
        run: python corgi_runner.py
        env:
          SHORTS_STATE_DIR: ${{ runner.temp }}/corgi-state
          CORGI_RECEIPT_DIR: ${{ runner.temp }}/corgi-receipts
          CORGI_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          CORGI_PUBLISH_DATE: ${{ inputs.publish_date_kst }}
          CORGI_ITEM_ID: ${{ inputs.item_id }}
          YOUTUBE_KOREAN_OAUTH: ${{ secrets.YOUTUBE_KOREAN_OAUTH }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Preserve upload receipts even when journal CAS fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corgi-upload-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corgi-receipts/*.json
          if-no-files-found: ignore
          retention-days: 90
