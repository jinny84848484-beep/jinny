name: World Kitchen private upload repeat check
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths: ['.github/workflows/world-kitchen-private-repeat.yml']
permissions:
  contents: read
jobs:
  verify-private-and-dedup:
    if: >-
      github.repository == 'jinny84848484-beep/jinny' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qa/world-kitchen-repeat-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recheck existing private upload without writing
        env:
          YOUTUBE_KITCHEN_OAUTH: ${{ secrets.YOUTUBE_KITCHEN_OAUTH }}
        run: |
          python - <<'PY'
          from world_kitchen import providers

          video_id = '3SjvlnnvoSs'
          marker = 'world-kitchen-private-smoke-20261128-once'
          token, uploads = providers.youtube_token()
          response = providers.http(
              'https://www.googleapis.com/youtube/v3/videos?part=snippet,status&id=' + video_id,
              headers={'Authorization': 'Bearer ' + token},
          )
          items = response.get('items', [])
          if len(items) != 1 or items[0]['snippet']['channelId'] != providers.TEMPLATE['channel_id']:
              raise RuntimeError('Incorrect or missing channel')
          item = items[0]
          state = item['status']
          if marker not in item['snippet']['description'] or state.get('privacyStatus') != 'private' or state.get('publishAt') or state.get('uploadStatus') not in {'uploaded', 'processed'}:
              raise RuntimeError('Fixture is not an uploaded, unscheduled private video')
          print(f"video_id={video_id} privacy=private schedule=none upload_status={state['uploadStatus']} writes=0", flush=True)
          found = providers.find_existing(token, uploads, marker)
          if found != video_id:
              raise RuntimeError('Duplicate lookup did not resolve exact private fixture via uploads playlist; no writes attempted')
          print('duplicate_guard=passed writes=0')
          PY
