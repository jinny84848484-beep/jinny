name: Additional Korean Short
on:
  workflow_dispatch:
    inputs:
      production_date:
        description: Approved Korea production date (YYYY-MM-DD)
        type: string
        required: true
      completed_anchor_day:
        description: Completed original daily batch date (defaults to production date)
        type: string
        required: false
      batch_id:
        description: Approved immutable YYYY-MM-DD-extra-NN identity
        type: string
        required: true
      approval_hash:
        description: Independently approved exact authorization SHA256
        type: string
        required: true
      expected_head:
        description: Reviewed deployed main commit SHA
        type: string
        required: true
      staged_sender_public_key:
        description: One-run Ed25519 sender public key
        type: string
        required: true
      continuation_record_hash:
        description: Optional exact prior paid FAIL record hash for approved one-shot continuation
        type: string
        required: false
      recovery_public_key:
        description: One-run X25519 encrypted-artifact recipient public key
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: shorts-production
  cancel-in-progress: false
jobs:
  additional:
    if: github.event_name == 'workflow_dispatch' && vars.PUBLIC_UPLOADS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned renderer and verified fonts
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: -r requirements.txt
          curl --fail --location --proto '=https' --connect-timeout 20 --max-time 180 \
            'https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-noto-cjk/fonts-noto-cjk_20230817+repack1-3_all.deb' \
            -o "$RUNNER_TEMP/fonts-noto-cjk.deb"
          echo "7d64b985f6fe128c99eae5610d5c047338e572bdcfb2bb09736be01b824a7f6c  $RUNNER_TEMP/fonts-noto-cjk.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/fonts-noto-cjk.deb" "$RUNNER_TEMP/verified-fonts"
          fontdir="$RUNNER_TEMP/verified-fonts/usr/share/fonts/opentype/noto"
          echo "b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  $fontdir/NotoSansCJK-Regular.ttc" | sha256sum -c -
          echo "faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  $fontdir/NotoSansCJK-Bold.ttc" | sha256sum -c -
          sudo install -d /usr/share/fonts/opentype/noto
          sudo install -m 644 "$fontdir/NotoSansCJK-Regular.ttc" "$fontdir/NotoSansCJK-Bold.ttc" /usr/share/fonts/opentype/noto/
          echo "b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc" | sha256sum -c -
          echo "faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc" | sha256sum -c -
          ffmpeg_exe="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$ffmpeg_exe"
          mkdir -p "$RUNNER_TEMP/shorts-bin"
          ln -s "$ffmpeg_exe" "$RUNNER_TEMP/shorts-bin/ffmpeg"
          echo "$RUNNER_TEMP/shorts-bin" >> "$GITHUB_PATH"
          echo "IMAGEIO_FFMPEG_EXE=$ffmpeg_exe" >> "$GITHUB_ENV"
      - name: Verify renderer before private input or paid work
        timeout-minutes: 3
        env:
          SHORTS_STATE_DIR: ${{ runner.temp }}/shorts-test-state
        run: |
          set -euo pipefail
          python preview_diagnostic.py
          ffmpeg -v error -y -f lavfi -i color=c=black:s=1080x1920:r=6:d=1 -f lavfi -i anullsrc=r=48000:cl=stereo -t 1 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -af loudnorm -c:a aac "$RUNNER_TEMP/renderer-smoke.mp4"
          test -s "$RUNNER_TEMP/renderer-smoke.mp4"
      - name: Test production guards offline
        env:
          SHORTS_STATE_DIR: ${{ runner.temp }}/shorts-test-state
        run: python -m unittest discover -s tests -v
      - name: Receive approved private input and produce one Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_OJIRAP_OAUTH: ${{ secrets.YOUTUBE_OJIRAP_OAUTH }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_UPLOADS_ENABLED: ${{ vars.PUBLIC_UPLOADS_ENABLED }}
          SHORTS_STATE_DIR: ${{ runner.temp }}/shorts-state
          STAGED_SENDER_PUBLIC_KEY: ${{ inputs.staged_sender_public_key }}
          ADDITIONAL_PRODUCTION_DATE: ${{ inputs.production_date }}
          ADDITIONAL_ANCHOR_DAY: ${{ inputs.completed_anchor_day }}
          ADDITIONAL_BATCH_ID: ${{ inputs.batch_id }}
          ADDITIONAL_APPROVAL_HASH: ${{ inputs.approval_hash }}
          ADDITIONAL_APPROVED_HEAD: ${{ inputs.expected_head }}
          ADDITIONAL_RECOVERY_PUBLIC_KEY: ${{ inputs.recovery_public_key }}
          ADDITIONAL_CONTINUATION_RECORD_HASH: ${{ inputs.continuation_record_hash }}
          ADDITIONAL_CONCURRENCY_GROUP: shorts-production
        run: python additional_driver.py
      - name: Save only encrypted recovery artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: additional-encrypted-${{ github.run_id }}
          path: private-artifacts/*.enc.json
          if-no-files-found: ignore
          retention-days: 1
