name: World Kitchen reviewed production
on:
  schedule:
    - cron: '0 8 * * *' # 17:00 KST public no-data check; private production is separate
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-kitchen-single-producer
  cancel-in-progress: false
jobs:
  public-queue-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Public check only (no render, cache, upload or schedule)
        run: python -m world_kitchen.public_queue_guard
