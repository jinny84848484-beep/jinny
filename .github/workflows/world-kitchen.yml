name: World Kitchen reviewed production
on:
  schedule:
    - cron: '7 1 * * *' # 10:07 KST early start: GitHub delays scheduled runs by hours; state.json stops a second upload
    - cron: '0 8 * * *' # 17:00 KST production; 19:00 is target publication metadata only
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-kitchen-single-producer
  cancel-in-progress: false
jobs:
  render-reviewed-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Restore cooking attempt ledger
        uses: actions/cache/restore@v4
        with:
          path: world_kitchen/state.json
          key: world-kitchen-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: world-kitchen-state-
      - name: Render reviewed local input (no paid calls or upload credentials)
        run: python -m world_kitchen.runner
      - name: Preserve attempt state even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: world_kitchen/state.json
          key: world-kitchen-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save cooking review package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: world-kitchen-review-${{ github.run_id }}
          path: |
            runs/world_kitchen/
            world_kitchen/state.json
          if-no-files-found: ignore
          retention-days: 7
