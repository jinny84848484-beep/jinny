name: Daily Shorts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight checks connections; produce publishes two Ojirap videos'
        type: choice
        options: [preflight, operator_preview_20261117, recover_json_input_20261117, recover_new_packet_20261117, recover_draft_429_20261117, produce, stage_produce, recover_saved_reviews, recover_research_manifest, recover_research_manifest_20261115, recover_research_manifest_20261116, clarify_date_20261115, recheck_editorial_policy, resume_reviewed, expire_stale_additional]
        default: preflight
      expire_batch_id:
        description: expire_stale_additional only - batch id (e.g. 2026-11-07-extra-01)
        type: string
        required: false
      expire_record_hash:
        description: expire_stale_additional only - record hash printed by the dry run
        type: string
        required: false
      expire_apply:
        description: expire_stale_additional only - write (true) or dry run (false)
        type: boolean
        default: false
      expire_confirm_no_upload:
        description: expire_stale_additional only - operator checked YouTube (no upload, or the external video below)
        type: boolean
        default: false
      external_video:
        description: expire_stale_additional only - optional channel:video_id uploaded outside the pipeline (e.g. ojirap:4B18u-hUPkw)
        type: string
        required: false
      staged_sender_public_key:
        description: One-run Ed25519 public key for stage_produce only
        type: string
        required: false
  schedule:
    - cron: '7 20 * * *' # 05:07 KST early start: GitHub delays scheduled runs by hours; later runs exit once the day is complete
    - cron: '7 22 * * *' # 07:07 KST, off the busy top of the hour
    - cron: '37 1 * * *' # 10:37 KST backup; a completed day exits immediately
    - cron: '17 3 * * *' # 12:17 KST backup (GitHub can delay or drop scheduled runs)
    - cron: '47 5 * * *' # 14:47 KST backup
    - cron: '17 8 * * *' # 17:17 KST backup
    - cron: '47 10 * * *' # 19:47 KST last backup of the KST day
permissions:
  contents: write
  actions: read
concurrency:
  group: shorts-production
  cancel-in-progress: false
jobs:
  schedule-receipt:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record native schedule arrival
        env:
          CRON_SLOT: ${{ github.event.schedule }}
          PUBLIC_GATE: ${{ vars.PUBLIC_UPLOADS_ENABLED == 'true' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          printf 'Native cron received: %s; runner KST: %s; run: %s; public gate enabled: %s\n' \
            "$CRON_SLOT" "$(TZ=Asia/Seoul date -Iseconds)" "$RUN_ID" "$PUBLIC_GATE"
  shorts:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLIC_UPLOADS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install -r requirements.txt
      - name: Test production guards
        run: python tests/run_offline.py
      - name: Run automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_OJIRAP_OAUTH: ${{ secrets.YOUTUBE_OJIRAP_OAUTH }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_UPLOADS_ENABLED: ${{ vars.PUBLIC_UPLOADS_ENABLED }}
          OPENAI_MODEL: gpt-5.4
          OPENAI_REVIEW_MODEL: gpt-5.4
          SHORTS_STATE_DIR: ${{ runner.temp }}/shorts-state
          IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
          STAGED_SENDER_PUBLIC_KEY: ${{ inputs.staged_sender_public_key }}
          RUN_MODE: ${{ inputs.mode || 'produce' }}
          EXPIRE_BATCH_ID: ${{ inputs.expire_batch_id }}
          EXPIRE_RECORD_HASH: ${{ inputs.expire_record_hash }}
          EXPIRE_APPLY: ${{ inputs.expire_apply }}
          EXPIRE_CONFIRM_NO_UPLOAD: ${{ inputs.expire_confirm_no_upload }}
          EXTERNAL_VIDEO: ${{ inputs.external_video }}
        run: |
          if [ "$RUN_MODE" = "operator_preview_20261117" ]; then
            python operator_review_recovery_20261117.py
          elif [ "$RUN_MODE" = "recover_json_input_20261117" ]; then
            python json_input_recovery_20261117.py
          elif [ "$RUN_MODE" = "recover_new_packet_20261117" ]; then
            python new_packet_recovery_20261117.py
          elif [ "$RUN_MODE" = "recover_draft_429_20261117" ]; then
            python draft_rate_recovery_20261117.py
          elif [ "$RUN_MODE" = "recover_saved_reviews" ]; then
            python cached_review_recovery.py
          elif [ "$RUN_MODE" = "recover_research_manifest" ]; then
            python research_manifest_recovery.py
          elif [ "$RUN_MODE" = "recover_research_manifest_20261115" ]; then
            python research_manifest_recovery_20261115.py
          elif [ "$RUN_MODE" = "recover_research_manifest_20261116" ]; then
            python research_manifest_recovery_20261116.py
          elif [ "$RUN_MODE" = "clarify_date_20261115" ]; then
            python date_clarification_recovery.py
          elif [ "$RUN_MODE" = "recheck_editorial_policy" ]; then
            python editorial_policy_recheck.py
          elif [ "$RUN_MODE" = "resume_reviewed" ]; then
            python reviewed_resume.py
          else
            python cloud_runner.py "$RUN_MODE"
          fi
      - name: Save produced media
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shorts-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
          retention-days: 7




