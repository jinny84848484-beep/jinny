name: Daily Shorts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight checks connections; produce publishes four videos'
        type: choice
        options: [preflight, produce, stage_produce]
        default: preflight
      staged_sender_public_key:
        description: One-run Ed25519 public key for stage_produce only
        type: string
        required: false
  schedule:
    - cron: '0 23 * * *'
permissions:
  contents: write
concurrency:
  group: shorts-production
  cancel-in-progress: false
jobs:
  shorts:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLIC_UPLOADS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install -r requirements.txt
      - name: Test production guards
        run: python -m unittest discover -s tests -v
      - name: Run automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_OJIRAP_OAUTH: ${{ secrets.YOUTUBE_OJIRAP_OAUTH }}
          YOUTUBE_KOREAN_OAUTH: ${{ secrets.YOUTUBE_KOREAN_OAUTH }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_UPLOADS_ENABLED: ${{ vars.PUBLIC_UPLOADS_ENABLED }}
          OPENAI_MODEL: gpt-5.4
          OPENAI_REVIEW_MODEL: gpt-5.4
          SHORTS_STATE_DIR: ${{ runner.temp }}/shorts-state
          IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
          STAGED_SENDER_PUBLIC_KEY: ${{ inputs.staged_sender_public_key }}
          RUN_MODE: ${{ inputs.mode || 'produce' }}
        run: python cloud_runner.py "$RUN_MODE"
      - name: Save produced media
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shorts-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
          retention-days: 7


