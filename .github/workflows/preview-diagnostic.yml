name: Offline Preview Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          python -m pip install -r requirements.txt
      - name: Test synthetic pixels without production access
        env:
          SHORTS_STATE_DIR: ${{ runner.temp }}/preview-state
          IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
        run: python preview_diagnostic.py
