name: Read-only TTS Audit
on:
  workflow_dispatch:
    inputs:
      production_date:
        description: Korea date to inspect (YYYY-MM-DD)
        type: string
        required: true
      expected_head:
        description: Reviewed deployed main commit SHA
        type: string
        required: true
      recovery_public_key:
        description: One-run X25519 public key for encrypted sanitized audit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: shorts-production
  cancel-in-progress: false
jobs:
  audit_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.0
      - name: Collect read-only sanitized evidence
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AUDIT_PRODUCTION_DATE: ${{ inputs.production_date }}
          AUDIT_EXPECTED_HEAD: ${{ inputs.expected_head }}
          AUDIT_RECOVERY_PUBLIC_KEY: ${{ inputs.recovery_public_key }}
        run: python additional_tts_audit.py
      - name: Save encrypted audit only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tts-audit-encrypted-${{ github.run_id }}
          path: private-artifacts/tts-audit.enc.json
          if-no-files-found: ignore
          retention-days: 1
